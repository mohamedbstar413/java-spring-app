name: CI Pipeline

on:
  push:
    branches:
      - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              name: Checkout code
            - name: Run Script
              run: |
                echo "Running CI pipeline..."
                #echo the actor's name, the branch, the commit SHA, and the event type
                echo "Actor: ${{ github.actor }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "Commit SHA: ${{ github.sha }}"
                echo "Event Type: ${{ github.event_name }}"
            - name: Installing java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '21'
            - name: Install dependencies
              run: |
                all_services=("analytics-service" "auth-service" "billing-service" "api-gateway" "patient-service")
                for service in $all_services; do
                    cd $service
                    mvn dependency:go-offline -B
                    cd ..
                done  
            - name: Build with Maven
              run: |
                #iterate throuah all microservices and build them
                all_services=("analytics-service" "auth-service" "billing-service" "api-gateway" "patient-service")
                for service in ${all_services[@]}; do
                    cd $service
                    mvn clean install -DskipTests
                    cd ..
                done
            - name: Build Docker image
              run: |
                #login to docker hub
                echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
                #iterate through all microservices and build docker images
                all_services=("analytics-service" "auth-service" "billing-service" "api-gateway" "patient-service")
                image_tag=${{github.sha}} #latest commit sha
                image_tag=${image_tag:0:10}
                for service in ${all_services[@]}; do
                    cd $service
                    docker build -t ${{ secrets.DOCKER_USERNAME }}/$service:${image_tag} .
                    docker push ${{ secrets.DOCKER_USERNAME }}/$service:${image_tag}
                    cd ..
                done
            