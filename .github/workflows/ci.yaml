name: CI Pipeline

on:
    pull_request:
        branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              name: Checkout code
            - name: Run Script
              run: |
                echo "Running CI pipeline..."
                #echo the actor's name, the branch, the commit SHA, and the event type
                echo "Actor: ${{ github.actor }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "Commit SHA: ${{ github.sha }}"
                echo "Event Type: ${{ github.event_name }}"
            - name: Installing java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'
            - name: Fail on branch name mismatch
              if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'feature/')
              run: |
                echo "Branch name mismatch. Expected 'feature/*' but got '${{ github.head_ref }}'."
                exit 1